on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 12.6.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Restore OG assets cache
        id: og-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            docs/public/og
            docs/.vitepress/plugins/data/og-satori
          key: og-${{ hashFiles('docs/.vitepress/plugins/satori-og.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            og-${{ hashFiles('docs/.vitepress/plugins/satori-og.ts') }}-

      - name: Build
        run: pnpm run build

      - name: Save OG assets cache
        uses: actions/cache/save@v6
        with:
          path: |
            docs/public/og
            docs/.vitepress/plugins/data/og-satori
          key: ${{ steps.og-cache-restore.outputs.cache-primary-key }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./docs/.vitepress/dist --project-name=cleanroom
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
