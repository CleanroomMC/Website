on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore OG image cache
        id: og-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/cleanroom-og
          key: og-${{ hashFiles('src/lib/og.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            og-${{ hashFiles('src/lib/og.ts') }}-

      - name: Build
        run: npm run build

      - name: Save OG image cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.cache/cleanroom-og
          key: ${{ steps.og-cache-restore.outputs.cache-primary-key }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=cleanroom
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
